name: V1.0-V3 integration tests

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  integration:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install test dependencies
        run: python -m pip install --upgrade pytest jsonschema
      - name: Run integration tests
        run: python -m pytest tests/integration/ -q
      - name: Run verification tests
        run: python -m pytest tests/verification/ -q
